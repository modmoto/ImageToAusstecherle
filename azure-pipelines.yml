name: $(Build.BuildId)

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: UseNode@1
  inputs:
    version: '22.x'

- script: |
    set -e
    npm ci
    npm test
  displayName: Install dependencies and run tests

- task: Docker@2
  displayName: Build and push Docker image
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  inputs:
    containerRegistry: official-docker-modmoto
    repository: modmoto/image-to-ausstecherle
    command: buildAndPush
    Dockerfile: Dockerfile
    buildContext: .
    tags: |
      $(Build.BuildId)
      latest

- bash: |
    set -e
    mkdir -p "$(Build.ArtifactStagingDirectory)"
    sed 's/${TAG:-latest}/${TAG:-$(Build.BuildId)}/' docker-compose.yml > "$(Build.ArtifactStagingDirectory)/docker-compose.yml"
    docker compose -f "$(Build.ArtifactStagingDirectory)/docker-compose.yml" config --quiet
  displayName: Stage Compose file with build image tag
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

- task: PublishBuildArtifacts@1
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  inputs:
    PathtoPublish: $(Build.ArtifactStagingDirectory)
    ArtifactName: drop
