services:
  ausstecherle:
    image: modmoto/image-to-ausstecherle:${TAG:-latest}
    container_name: image-to-ausstecherle-${CONTAINER_SUFFIX}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  default:
    external: true
    name: caddy
