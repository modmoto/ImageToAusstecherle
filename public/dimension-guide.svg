<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 440" role="img" aria-labelledby="title desc">
<title id="title">Cookie cutter dimension guide</title><desc id="desc">A heart-shaped cutter and wall cross-section showing all default dimensions.</desc>
<defs>
 <marker id="arrow" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto-start-reverse"><path d="M0 0 5 2.5 0 5" fill="#627762"/></marker>
 <path id="heart" d="M140 180C112 160 35 116 35 76C35 32 96 25 140 70C184 25 245 32 245 76C245 116 168 160 140 180Z"/>
</defs>
<rect width="280" height="440" rx="9" fill="#f3f6ef"/>
<g font-family="Arial,sans-serif" fill="#425d48" font-size="10">
 <text x="16" y="22" font-size="11" font-weight="bold">How the dimensions work</text>
 <g transform="translate(0 29)">
  <use href="#heart" transform="translate(-9 66) scale(1.065 .67)" fill="#355c4a"/>
  <use href="#heart" transform="translate(-9 59) scale(1.065 .67)" fill="#95b69a"/>
  <use href="#heart" transform="translate(0 50) scale(1 .67)" fill="#4f8268"/>
  <use href="#heart" transform="translate(0 20) scale(1 .67)" fill="#f3f6ef" stroke="#51856b" stroke-width="5"/>
  <path d="M35 71V101M245 71V101M140 141V171" fill="none" stroke="#427158" stroke-width="2"/>
  <path d="M36 22H244" stroke="#627762" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="140" y="14" text-anchor="middle">Contour width (X) · 50 mm</text>
  <text x="140" y="103" text-anchor="middle" font-size="9">Open through the base</text>
  <path d="M232 119 254 142" fill="none" stroke="#627762"/>
  <text x="140" y="201" text-anchor="middle">Base margin · 5 mm beyond the wall</text>
  <path d="M242 146 218 185" fill="none" stroke="#627762"/>
 </g>
 <path d="M16 244H264" stroke="#d8e1d1"/>
 <text x="16" y="264" font-weight="bold">Wall cross-section</text>
 <path d="M47 407H114V317L106 287H104L96 317V382H47Z" fill="#9cbea2" stroke="#4c7656" stroke-width="1.5"/>
 <g stroke="#627762" fill="none" stroke-width=".8">
  <path d="M104 280H106" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M106 288 131 282"/>
  <path d="M104 317H130"/>
  <path d="M96 357H114" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M114 357H130"/>
  <path d="M37 287V382" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M114 395H130"/>
  <path d="M37 382V407" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
 </g>
 <text x="136" y="283">Cutting edge</text><text x="136" y="296" font-weight="bold">0.1 mm</text>
 <text x="136" y="317">Taper starts at 15 mm</text><text x="136" y="330" font-size="9">Last 5 mm become thinner</text>
 <text x="136" y="355">Wall thickness</text><text x="136" y="368" font-weight="bold">1.2 mm</text>
 <text x="136" y="395">Base thickness</text><text x="136" y="408" font-weight="bold">5 mm</text>
 <text transform="translate(24 370) rotate(-90)" font-size="9">Wall height · 20 mm</text>
 <text x="140" y="430" text-anchor="middle" font-size="9" fill="#819279">Total height = 20 mm wall + 5 mm base</text>
</g>
</svg>
