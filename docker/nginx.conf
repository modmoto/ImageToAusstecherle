server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The image's nginx.conf includes mime.types, including application/wasm.
    location / {
        try_files $uri $uri/ =404;
    }

    # Always revalidate the entry point after a new deployment.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite gives these files content hashes, so they can be cached indefinitely.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
